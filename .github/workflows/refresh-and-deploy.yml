name: Refresh public research and publish website
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research collector dependencies
        run: pip install -r backend/requirements.txt
      - name: Restore previous research database
        uses: actions/cache/restore@v4
        with:
          path: backend/merch_radar_v2.db
          key: merch-research-db-v1-${{ github.run_id }}
          restore-keys: |
            merch-research-db-v1-
      - name: Refresh public observations
        run: python backend/run_refresh.py
      - name: Save the observed dataset for later comparisons
        uses: actions/cache/save@v4
        with:
          path: backend/merch_radar_v2.db
          key: merch-research-db-v1-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
